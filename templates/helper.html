<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<title>유튜브 업로드 헬퍼</title>
<link rel="preload" href="/static/fonts/CookieRun-Bold.otf" as="font" type="font/otf" crossorigin>
<script src="/static/thumb-upload.js" defer></script>
<script src="/static/thumbnail.js" defer></script>
<link rel="stylesheet" href="/static/helper.css">
</head>
<body>
<main>
  <nav class="global-nav" aria-label="주요 메뉴"><a class="brand" href="/"><span class="logo"></span>콘텐츠 작업실</a><div class="links"><a href="/">다운로드</a><a href="/edit-helper">편집 헬퍼</a><a href="/helper" aria-current="page">업로드 헬퍼</a><a href="/upload-process">업로드 프로세스</a><a href="/shorts">쇼츠 현황판</a><a href="/references">레퍼 체크</a></div></nav>
  <div class="head"><h1><span class="logo"></span>유튜브 업로드 헬퍼</h1></div>

  <div class="layout">
    <!-- 기능 목록: 새 기능은 여기 버튼 하나 + 아래 section.panel 하나를 추가한다 -->
    <aside class="card tools">
      <h2>기능</h2>
      <button type="button" class="tool active" data-tool="recipe">📝 SNS 레시피 게시글<small>원본 레시피 → 인스타그램·유튜브·틱톡 게시글</small></button>
      <button type="button" class="tool" data-tool="thumbnail">🖼️ 쇼츠 썸네일 만들기<small>영상 장면 선택 → 세로형 커버 저장</small></button>
      <div class="tool soon">＋ 더 많은 기능 준비 중<small>제목·태그·고정 댓글 등</small></div>
    </aside>

    <div>
      <!-- 기능 1: SNS 레시피 게시글 제작 -->
      {% include "recipe_fragment.html" %}
      <section class="panel hidden" data-tool="thumbnail">
        <div class="panel-head">
          <h2>쇼츠 썸네일 만들기</h2>
          <p>영상 장면을 고르고 문구를 더해 9:16 쇼츠 커버를 저장합니다.</p>
        </div>
        {% include "thumbnail_fragment.html" %}
      </section>
    </div>
  </div>

  <p class="footer">업로드에 필요한 게시글과 쇼츠 썸네일을 한 곳에서 준비하세요.</p>
</main>

<div id="toast"></div>

<script id="helperModels" type="application/json">{{ models | tojson }}</script>
<script src="/static/recipe-editor.js" defer></script>
<script>
  const $ = (id) => document.getElementById(id);
  let toastTimer = null;

  function toast(msg, isErr = false) {
    const t = $('toast'); t.textContent = msg; t.className = 'show' + (isErr ? ' err' : '');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = '', 1800);
  }
  async function api(method, url, body) {
    const opt = { method, headers: {} };
    if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
    const r = await fetch(url, opt);
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || ('요청 실패 (' + r.status + ')'));
    return data;
  }
  function showMsg(el, text, kind) {
    el.textContent = text; el.className = 'msg ' + kind; el.classList.toggle('hidden', !text);
  }

  // ---- 기능 전환 (왼쪽 목록) -------------------------------------------------
  document.querySelectorAll('.tool[data-tool]').forEach(b => b.addEventListener('click', () => selectTool(b.dataset.tool)));
  function selectTool(key) {
    document.querySelectorAll('.tool[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === key));
    document.querySelectorAll('.panel[data-tool]').forEach(p => p.classList.toggle('hidden', p.dataset.tool !== key));
    try { localStorage.setItem('helper.tool', key); } catch {}
  }
  const params = new URLSearchParams(location.search);   // 현황판에서 넘어올 때: ?row=N&src=…&dish=…#thumbnail
  selectTool(location.hash === '#thumbnail' || params.has('row') ? 'thumbnail' : (() => { try { return localStorage.getItem('helper.tool'); } catch { return null; } })() || 'recipe');

  // ---- 썸네일 만들기 → 현황판 등록 -------------------------------------------------
  // 대상 행은 현황판에서 넘어온 값으로 미리 고르거나, 아래 검색·드롭다운으로 직접 고른다.
  // 마지막 선택은 기억하지 않는다 (다른 행에 잘못 덮어쓰는 사고 방지).
  let targets = [];            // /api/shorts 항목
  let uploadReady = false;
  const EXPORT_LABEL = '이미지 저장 ↓', EXPORT_LABEL_TARGET = '이미지 저장 + 현황판 등록 ↓';
  function targetInfo(it) { return `${it.row}행 · ${it.dish_title || '(제목 없음)'}${it.video?.title ? ' — ' + it.video.title : ''}`; }
  function renderTargetOptions(query) {
    const sel = $('targetRow'); const keep = sel.value;
    const q = (query || '').trim().toLowerCase();
    const list = q ? targets.filter(it => [it.dish_title, it.video?.title, it.source?.channel, it.source?.title].some(v => (v || '').toLowerCase().includes(q))) : targets;
    sel.innerHTML = '<option value="">등록하지 않음 · 다운로드만</option>' +
      list.map(it => `<option value="${it.row}">${targetInfo(it).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</option>`).join('');
    if (keep && !list.some(it => String(it.row) === keep)) {   // 검색으로 가려진 선택 항목은 맨 위에 유지
      const cur = targets.find(it => String(it.row) === keep);
      if (cur) sel.insertAdjacentHTML('afterbegin', `<option value="${cur.row}">${targetInfo(cur).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</option>`);
    }
    sel.value = keep || '';
    updateTargetState();
  }
  function selectedTarget() { return targets.find(it => String(it.row) === $('targetRow').value) || null; }
  function updateTargetState() {
    const it = selectedTarget();
    $('export').textContent = it ? EXPORT_LABEL_TARGET : EXPORT_LABEL;
    if (it) $('targetStatus').textContent = `저장하면 현황판 ${it.row}행(${it.dish_title || '제목 없음'})에 등록됩니다.`;
    else if (uploadReady) $('targetStatus').textContent = '';
  }
  async function loadTargets() {
    const st = $('targetState'), status = $('targetStatus');
    try {
      const d = await api('GET', '/api/shorts');
      const sheet = d.sheet || {};
      if (!sheet.configured) { st.textContent = '· 시트 미연결'; st.className = 'target-state bad'; status.innerHTML = '<a href="/shorts">쇼츠 현황판</a>에서 시트를 먼저 연결하세요.'; return; }
      if (!sheet.upload_configured) { st.textContent = '· 업로드 미설정'; st.className = 'target-state bad'; status.innerHTML = '<a href="/shorts">쇼츠 현황판</a>의 썸네일 업로드 설정(웹 앱 URL·토큰)을 먼저 저장하세요.'; return; }
      uploadReady = true;
      targets = (d.items || []).slice().sort((a, b) => a.row - b.row);
      st.textContent = `· ${targets.length}개 항목`; st.className = 'target-state';
      $('targetSearch').disabled = $('targetRow').disabled = false;
      renderTargetOptions('');
      const row = params.get('row');
      if (row) {
        const itemId = params.get('item_id');
        const hit = targets.find(it => itemId ? it.item_id === itemId : String(it.row) === row);
        if (hit) { $('targetRow').value = String(hit.row); updateTargetState(); status.textContent = `현황판에서 넘어옴 · ${targetInfo(hit)} — 저장하면 이 행에 등록됩니다.`; }
        else status.textContent = `현황판 ${row}행을 찾지 못했습니다. 아래에서 직접 고르세요.`;
      }
    } catch (e) { st.textContent = '· 불러오기 실패'; st.className = 'target-state bad'; status.textContent = '현황판 항목을 불러오지 못했습니다: ' + e.message; }
  }
  $('targetSearch').addEventListener('input', () => renderTargetOptions($('targetSearch').value));
  $('targetRow').addEventListener('change', updateTargetState);
  // thumbnail.js 가 이미지를 내려받은 직후 알려 준다 → 대상 행이 있으면 같은 이미지를 현황판에 등록
  document.addEventListener('thumbnail:exported', async (e) => {
    const it = selectedTarget(); if (!it) return;
    const status = $('targetStatus');
    status.textContent = `현황판 ${it.row}행에 등록하는 중…`;
    try {
      const blob = await ThumbUpload.normalizeImage(e.detail.blob);
      const r = await ThumbUpload.upload({ row: it.row, itemId: it.item_id, srcUrl: it.source?.url, dish: it.dish_title, blob, filename: `shorts-thumbnail-${e.detail.stamp || Date.now()}.jpg` });
      status.innerHTML = `현황판 ${r.row}행(${(it.dish_title || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))})에 등록했습니다 · <a href="/shorts">현황판 보기 →</a>`;
      toast(`현황판 ${r.row}행에 썸네일을 등록했습니다`);
    } catch (err) {
      status.textContent = `다운로드는 완료됐지만 현황판 등록에 실패했습니다: ${err.message}`;
      toast(err.message, true);
    }
  });
  loadTargets();

</script>
</body>
</html>
