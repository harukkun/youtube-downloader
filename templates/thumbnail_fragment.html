<div class="thumbnail-workspace">
  <div class="thumbnail-editor">
    <section class="thumb-card">
      <h2><span>01</span> 영상 또는 이미지 선택</h2>
      <label class="drop" id="drop" for="file"><strong>영상이나 이미지를 놓거나 클릭해서 선택</strong><span>MOV · MP4 영상 / PNG · JPG · WebP 이미지</span><input id="file" type="file" accept="video/*,image/png,image/jpeg,image/webp,.mov,.mp4,.png,.jpg,.jpeg,.webp"></label>
      <p class="hint">파일은 내 브라우저에서만 처리됩니다.</p><p id="fileInfo" class="hint"></p>
      <div id="videoArea" hidden><video id="video" controls playsinline preload="auto" aria-label="장면 선택용 영상"></video>
        <label for="timeline">장면 탐색 <output id="time">00:00.0 / 00:00.0</output></label><input id="timeline" type="range" min="0" max="0" step="0.1" value="0" disabled>
        <div class="buttons"><button id="prev" class="secondary" disabled>−0.1초</button><button id="next" class="secondary" disabled>+0.1초</button><button id="capture" disabled>이 장면 사용</button></div>
      </div>
      <p id="videoStatus" class="status" role="status" aria-live="polite">영상이나 이미지를 선택해 시작하세요.</p>
    </section>

    <section class="thumb-card"><h2><span>02</span> 타이포 편집</h2><p class="hint">CookieRun Bold · 글자색과 외곽선 색을 각각 선택하세요.</p>
      <label for="subtitle">서브타이틀</label><input id="subtitle" type="text" value="어남선생 류수영" maxlength="100">
      <div class="type-controls" data-kind="subtitle"></div><div class="color-controls">
        <label for="subtitle-fill">글자색<input id="subtitle-fill" type="color" value="#ffffff" aria-label="서브타이틀 글자색"></label>
        <label for="subtitle-stroke">외곽선 색<input id="subtitle-stroke" type="color" value="#000000" aria-label="서브타이틀 외곽선 색"></label>
      </div>
      <label for="title">타이틀</label><textarea id="title" rows="2" maxlength="200">'만원찜닭'</textarea><p class="hint">최대 두 줄 · 긴 문구는 너비에 맞게 자동 축소됩니다.</p>
      <div class="type-controls" data-kind="title"></div><div class="color-controls">
        <label for="title-fill">글자색<input id="title-fill" type="color" value="#ffffff" aria-label="타이틀 글자색"></label>
        <label for="title-stroke">외곽선 색<input id="title-stroke" type="color" value="#000000" aria-label="타이틀 외곽선 색"></label>
      </div><button id="resetType" class="secondary">템플릿 초기화</button>
    </section>

    <section class="thumb-card"><h2><span>03</span> 구도와 저장</h2><label for="zoom">배경 확대 <output id="zoomValue">100%</output></label><input id="zoom" type="number" min="100" max="300" step="1" value="100" disabled><input id="zoom-range" type="range" aria-label="배경 확대" min="100" max="300" step="1" value="100" disabled><p class="hint">미리보기의 배경을 드래그해 구도를 조정하세요.</p><button id="resetCrop" class="secondary" disabled>구도 초기화</button>
      <div class="export"><label for="format">이미지 형식<select id="format"><option value="png">PNG</option><option value="jpg">JPG · 품질 100%</option></select></label><button id="export" disabled>이미지 저장 ↓</button></div><p id="exportStatus" class="status" role="status" aria-live="polite"></p>
    </section>
  </div>
  <aside class="thumbnail-preview"><div class="preview-head"><h2>미리보기</h2><span>1080 × 1920</span></div><div class="canvas-wrap"><canvas id="canvas" width="1080" height="1920" aria-label="썸네일 미리보기"></canvas><div id="empty"><span>9:16</span><strong>어떤 장면을 담을까요?</strong><p>이미지를 선택하거나 영상에서 장면을 골라주세요.</p></div></div><p id="frameInfo" class="hint">선택한 장면이 여기에 표시됩니다.</p><p id="fontStatus" class="status" role="status">폰트를 불러오는 중입니다…</p><button id="retryFont" class="secondary" hidden>폰트 다시 불러오기</button></aside>
</div>
