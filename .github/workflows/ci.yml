name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 새로 푸시하면 진행 중이던 검사는 취소한다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: 파이썬 테스트 (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # README 가 밝힌 최소 버전과 개발에 쓰는 버전 양쪽을 확인한다.
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      # 테스트가 fixture 영상을 만들 때 쓴다 (tests/hooks_fixture.py make_video).
      - name: ffmpeg 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 단위 테스트
        run: python -m unittest discover -q

  node:
    name: 노드 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # 브라우저 없이 도는 검사. Apps Script 는 node:vm 으로, 프런트 모듈은 require 로 불러온다.
      - name: 시트·프런트 스크립트 테스트
        run: |
          node tests/test_reference_layout.js
          node tests/test_board_script.js
          node tests/test_board_edit.js
          node tests/test_upload_process.js
          node tests/test_upload_script.js

  browser:
    name: 브라우저 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: ffmpeg 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # 저장소에 package.json 을 두지 않으려고 체크아웃 밖에 설치하고 NODE_PATH 로 연결한다.
      - name: Playwright 설치
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install playwright@1 --no-audit --no-fund
          npx playwright install --with-deps chrome
      # fixture 서버는 시트·LLM·유튜브 호출을 모두 가짜로 바꾼 로컬 전용 서버다.
      - name: 브라우저 테스트 (업로드 프로세스, 후킹 클립)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          set -euo pipefail
          # 주의: `명령 && break` 형태는 set -e 에서 첫 실패에 스텝을 끝내므로 if 로 쓴다.
          run_suite() {
            local fixture=$1 port=$2 suite=$3 log pid status
            log="$RUNNER_TEMP/$(basename "$fixture" .py).log"
            python "$fixture" > "$log" 2>&1 &
            pid=$!
            for _ in $(seq 90); do
              if curl -s -o /dev/null "http://127.0.0.1:$port/"; then break; fi
              if ! kill -0 "$pid" 2>/dev/null; then
                echo "::error::$fixture 서버가 뜨지 못했습니다"
                cat "$log"
                return 1
              fi
              sleep 1
            done
            status=0
            node "$suite" || status=$?
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            if [ "$status" -ne 0 ]; then
              echo "--- $fixture 서버 로그"
              cat "$log"
            fi
            return "$status"
          }
          run_suite tests/upload_browser_fixture.py 8877 tests/test_upload_browser.js
          run_suite tests/hooks_browser_fixture.py 8878 tests/test_hooks_browser.js
      # 아래 검사는 현재 main 에서도 실패한다(탭 전환 뒤 조리 패널이 그대로 보임).
      # 고친 뒤 continue-on-error 를 지워 검사를 강제로 되돌리세요.
      - name: 브라우저 테스트 (조리 대사 추출, 알려진 실패)
        continue-on-error: true
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          set -euo pipefail
          python tests/cooking_browser_fixture.py > "$RUNNER_TEMP/cooking.log" 2>&1 &
          pid=$!
          for _ in $(seq 90); do
            if curl -s -o /dev/null http://127.0.0.1:8881/; then break; fi
            sleep 1
          done
          status=0
          node tests/test_cooking_browser.js || status=$?
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          if [ "$status" -ne 0 ]; then
            echo "--- cooking fixture 서버 로그"
            cat "$RUNNER_TEMP/cooking.log"
          fi
          exit "$status"
